<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Admin FilaZero</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/icons.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="/admin/dashboard" class="sidebar-logo"><i class="icon-calendar"></i> FilaZero</a>
      </div>
      
      <ul class="sidebar-menu">
        <li><a href="/admin/dashboard" class="sidebar-link">
          <span class="sidebar-icon"><i class="icon-chart"></i></span> Dashboard
        </a></li>
        <li><a href="/admin/appointments" class="sidebar-link">
          <span class="sidebar-icon"><i class="icon-calendar"></i></span> Agendamentos
        </a></li>
        <li><a href="/admin/services" class="sidebar-link">
          <span class="sidebar-icon"><i class="icon-scissors"></i></span> Serviços
        </a></li>
        <li><a href="/admin/clients" class="sidebar-link active">
          <span class="sidebar-icon"><i class="icon-users"></i></span> Clientes
        </a></li>
        <li><a href="/admin/settings" class="sidebar-link">
          <span class="sidebar-icon"><i class="icon-settings"></i></span> Configurações
        </a></li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="logout()">Sair</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <button class="mobile-sidebar-toggle" onclick="toggleSidebar()"><i class="icon-menu"></i></button>
        <h1 class="admin-title">Clientes</h1>
        <div class="admin-actions">
          <button class="theme-toggle" onclick="toggleTheme()"><i class="icon-moon"></i></button>
        </div>
      </header>

      <div class="admin-content">
        <div class="table-container">
          <div class="table-header">
            <h2 class="table-title">Lista de Clientes</h2>
          </div>
          <div id="clients-table"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Histórico -->
  <div id="history-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Histórico de Agendamentos</h3>
        <button class="modal-close" onclick="closeModal('history-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="client-history"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('history-modal')">Fechar</button>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let clients = [];

    async function loadClients() {
      try {
        const response = await fetch('/api/clients');
        clients = await response.json();

        const container = document.getElementById('clients-table');

        if (clients.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="icon-users"></i></div>
              <p>Nenhum cliente cadastrado</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Cadastrado</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${clients.map(client => `
                <tr>
                  <td><strong>${client.name}</strong></td>
                  <td>${client.phone}</td>
                  <td>${client.email || '-'}</td>
                  <td>${formatDate(client.created_at.split(' ')[0])}</td>
                  <td>
                    <button class="action-btn" onclick="viewHistory(${client.id}, '${client.name.replace(/'/g, "\\'")}')" title="Ver histórico"><i class="icon-calendar"></i></button>
                    <button class="action-btn btn-danger" onclick="deleteClient(${client.id})" title="Apagar cliente"><i class="icon-trash"></i></button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Erro ao carregar clientes:', error);
        showNotification('Erro ao carregar clientes', 'error');
      }
    }

    async function viewHistory(clientId, clientName) {
      try {
        const response = await fetch(`/api/clients/${clientId}/history`);
        const history = await response.json();

        const container = document.getElementById('client-history');
        const modalTitle = document.querySelector('#history-modal .modal-title');
        modalTitle.textContent = `Histórico de ${clientName}`;

        if (history.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <p>Nenhum agendamento encontrado</p>
            </div>
          `;
        } else {
          container.innerHTML = `
            <table class="table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Horário</th>
                  <th>Serviço</th>
                  <th>Valor</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${history.map(apt => `
                  <tr>
                    <td>${formatDate(apt.appointment_date)}</td>
                    <td>${formatTime(apt.appointment_time)}</td>
                    <td>${apt.service_name}</td>
                    <td>${apt.price ? formatCurrency(apt.price) : '-'}</td>
                    <td><span class="badge badge-${apt.status}">${getStatusText(apt.status)}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        openModal('history-modal');
      } catch (error) {
        console.error('Erro ao carregar histórico:', error);
        showNotification('Erro ao carregar histórico', 'error');
      }
    }

    function getStatusText(status) {
      const statusMap = {
        pending: 'Pendente',
        confirmed: 'Confirmado',
        completed: 'Concluído',
        cancelled: 'Cancelado'
      };
      return statusMap[status] || status;
    }

    async function deleteClient(clientId) {
      const client = clients.find(c => c.id === clientId);
      if (!client) return;
      
      if (!confirm(`Tem certeza que deseja apagar o cliente "${client.name}"?\n\nAtenção: Isso também apagará todos os agendamentos deste cliente!`)) {
        return;
      }

      try {
        console.log('Deletando cliente:', clientId);
        
        const response = await fetch(`/api/clients/${clientId}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers.get('content-type'));

        if (!response.ok) {
          const text = await response.text();
          console.error('Response text:', text);
          throw new Error('Erro na requisição');
        }

        const result = await response.json();
        console.log('Result:', result);

        if (result.success) {
          showNotification('Cliente apagado com sucesso!', 'success');
          loadClients();
        } else {
          showNotification(result.message, 'error');
        }
      } catch (error) {
        console.error('Erro ao apagar cliente:', error);
        showNotification('Erro ao apagar cliente', 'error');
      }
    }

    loadClients();
  </script>
</body>
</html>
