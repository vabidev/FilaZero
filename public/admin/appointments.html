<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos - Admin FilaZero</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="/admin/dashboard" class="sidebar-logo">📅 FilaZero</a>
      </div>
      
      <ul class="sidebar-menu">
        <li><a href="/admin/dashboard" class="sidebar-link">
          <span class="sidebar-icon">📊</span> Dashboard
        </a></li>
        <li><a href="/admin/appointments" class="sidebar-link active">
          <span class="sidebar-icon">📅</span> Agendamentos
        </a></li>
        <li><a href="/admin/services" class="sidebar-link">
          <span class="sidebar-icon">✂️</span> Serviços
        </a></li>
        <li><a href="/admin/clients" class="sidebar-link">
          <span class="sidebar-icon">👥</span> Clientes
        </a></li>
        <li><a href="/admin/settings" class="sidebar-link">
          <span class="sidebar-icon">⚙️</span> Configurações
        </a></li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="logout()">Sair</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <button class="mobile-sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <h1 class="admin-title">Agendamentos</h1>
        <div class="admin-actions">
          <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
      </header>

      <div class="admin-content">
        <!-- Filtros -->
        <div class="card mb-4">
          <div class="grid grid-3">
            <div class="form-group">
              <label class="form-label">Data</label>
              <input type="date" id="filter-date" class="form-control" onchange="loadAppointments()">
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="filter-status" class="form-control" onchange="loadAppointments()">
                <option value="">Todos</option>
                <option value="pending">Pendente</option>
                <option value="confirmed">Confirmado</option>
                <option value="completed">Concluído</option>
                <option value="cancelled">Cancelado</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">&nbsp;</label>
              <button class="btn btn-secondary" onclick="clearFilters()">Limpar Filtros</button>
            </div>
          </div>
        </div>

        <!-- Tabela -->
        <div class="table-container">
          <div class="table-header">
            <h2 class="table-title">Lista de Agendamentos</h2>
          </div>
          <div id="appointments-table"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    let appointments = [];

    async function loadAppointments() {
      try {
        const date = document.getElementById('filter-date').value;
        const status = document.getElementById('filter-status').value;

        let url = '/api/appointments?';
        if (date) url += `date=${date}&`;
        if (status) url += `status=${status}&`;

        const response = await fetch(url);
        appointments = await response.json();

        const container = document.getElementById('appointments-table');

        if (appointments.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📅</div>
              <p>Nenhum agendamento encontrado</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Horário</th>
                <th>Cliente</th>
                <th>Telefone</th>
                <th>Serviço</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${appointments.map(apt => `
                <tr>
                  <td>${formatDate(apt.appointment_date)}</td>
                  <td><strong>${formatTime(apt.appointment_time)}</strong></td>
                  <td>${apt.client_name}</td>
                  <td>${apt.client_phone}</td>
                  <td>${apt.service_name}</td>
                  <td>${apt.price ? formatCurrency(apt.price) : '-'}</td>
                  <td>
                    <select class="form-control" style="padding: 0.375rem;" 
                            onchange="updateStatus(${apt.id}, this.value)">
                      <option value="pending" ${apt.status === 'pending' ? 'selected' : ''}>Pendente</option>
                      <option value="confirmed" ${apt.status === 'confirmed' ? 'selected' : ''}>Confirmado</option>
                      <option value="completed" ${apt.status === 'completed' ? 'selected' : ''}>Concluído</option>
                      <option value="cancelled" ${apt.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
                    </select>
                  </td>
                  <td>
                    <button class="action-btn action-btn-delete" onclick="deleteAppointment(${apt.id})" title="Deletar">🗑️</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Erro ao carregar agendamentos:', error);
        showNotification('Erro ao carregar agendamentos', 'error');
      }
    }

    async function updateStatus(id, status) {
      try {
        const response = await fetch(`/api/appointments/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });

        const result = await response.json();

        if (result.success) {
          showNotification('Status atualizado com sucesso', 'success');
        } else {
          showNotification(result.message, 'error');
          loadAppointments();
        }
      } catch (error) {
        console.error('Erro ao atualizar status:', error);
        showNotification('Erro ao atualizar status', 'error');
      }
    }

    async function deleteAppointment(id) {
      if (!confirmDelete('Tem certeza que deseja excluir este agendamento?')) {
        return;
      }

      try {
        const response = await fetch(`/api/appointments/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (result.success) {
          showNotification(result.message, 'success');
          loadAppointments();
        } else {
          showNotification(result.message, 'error');
        }
      } catch (error) {
        console.error('Erro ao deletar agendamento:', error);
        showNotification('Erro ao deletar agendamento', 'error');
      }
    }

    function clearFilters() {
      document.getElementById('filter-date').value = '';
      document.getElementById('filter-status').value = '';
      loadAppointments();
    }

    // Definir filtro de data padrão como hoje
    document.getElementById('filter-date').value = new Date().toISOString().split('T')[0];
    
    loadAppointments();
  </script>
</body>
</html>
