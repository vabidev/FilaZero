<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin FilaZero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/icons.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--gradient-hero);
      position: relative;
      overflow: hidden;
    }

    body::after {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
      border-radius: 50%;
      filter: blur(40px);
      animation: heroBlobOne 12s ease-in-out infinite alternate;
    }

    .login-container {
      background: var(--glass-bg-heavy);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.15),
        0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      animation: fadeInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo-text {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .error-message {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid rgba(225, 112, 85, 0.2);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
      font-size: 0.9rem;
      animation: shake 0.5s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--glass-border);
    }

    .login-footer a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .login-footer a:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-text"><i class="icon-settings"></i> FilaZero</div>
      <p class="login-subtitle">Painel Administrativo</p>
    </div>

    <div id="error-message" class="error-message"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input type="text" id="username" class="form-control" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-accent" style="width: 100%;">Entrar</button>
    </form>

    <div class="login-footer">
      <a href="/">← Voltar ao site</a>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errorDiv.textContent = result.message;
          errorDiv.style.display = 'block';
          setTimeout(() => {
            errorDiv.style.display = 'none';
          }, 3000);
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao fazer login. Tente novamente.';
        errorDiv.style.display = 'block';
      }
    }

    // Verificar se já está autenticado
    async function checkAuth() {
      try {
        const response = await fetch('/api/check-auth');
        const result = await response.json();

        if (result.authenticated) {
          window.location.href = '/admin/dashboard';
        }
      } catch (error) {
        console.error('Erro ao verificar autenticação:', error);
      }
    }

    checkAuth();
  </script>
</body>

</html>
