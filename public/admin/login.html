<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Admin FilaZero</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/icons.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
    }

    .login-container {
      background-color: var(--bg-primary);
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      animation: fadeInUp 0.5s ease;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo-text {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .error-message {
      background-color: var(--danger);
      color: white;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .login-footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-text"><i class="icon-settings"></i> FilaZero</div>
      <p class="login-subtitle">Painel Administrativo</p>
    </div>

    <div id="error-message" class="error-message"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input type="text" id="username" class="form-control" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-accent" style="width: 100%;">Entrar</button>
    </form>

    <div class="login-footer">
      <a href="/">← Voltar ao site</a>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errorDiv.textContent = result.message;
          errorDiv.style.display = 'block';
          setTimeout(() => {
            errorDiv.style.display = 'none';
          }, 3000);
        }
      } catch (error) {
        errorDiv.textContent = 'Erro ao fazer login. Tente novamente.';
        errorDiv.style.display = 'block';
      }
    }

    // Verificar se já está autenticado
    async function checkAuth() {
      try {
        const response = await fetch('/api/check-auth');
        const result = await response.json();
        
        if (result.authenticated) {
          window.location.href = '/admin/dashboard';
        }
      } catch (error) {
        console.error('Erro ao verificar autenticação:', error);
      }
    }

    checkAuth();
  </script>
</body>
</html>
